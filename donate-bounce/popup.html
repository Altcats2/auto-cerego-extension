<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; margin-bottom: 10px; }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 3px;
        padding: 5px 6px;
        font: inherit;
      }
      .row { display: flex; gap: 8px; }
      button { flex: 1; padding: 6px; font: inherit; cursor: pointer; }
      #status { min-height: 1.4em; margin: 8px 0 0; color: #2a7a2a; }
      #status.error { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>Donate Bounce</h1>
    <label>
      Show after (minutes, min <span id="min-delay"></span>)
      <input id="delay" type="number" />
    </label>
    <label>
      Donate link
      <input id="url" type="url" placeholder="https://..." />
    </label>
    <div class="row">
      <button id="save">Save</button>
      <button id="now">Bounce now</button>
    </div>
    <p id="status"></p>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
